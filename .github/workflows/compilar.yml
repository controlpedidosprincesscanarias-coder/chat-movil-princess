# Compila Chat Dpto. Compras Princess (Android) y genera la .apk firmada.
#
# La idea y el desarrollo de la aplicación, incluidas sus pruebas, son de Víctor Alejandro Martín Andrade,
# para el Departamento de Central de Compras de Princess Hotels en Canarias.
#
# Solo se lanza A MANO (pestaña Actions → «Compilar Chat Princess» → Run workflow); nunca al subir código.
#   - destino «solo-descarga»: deja la .apk y su .sha256 como descarga del propio workflow (sin Release).
#   - destino «borrador»: además crea una Release en BORRADOR. Los móviles consultan /releases/latest,
#     que nunca devuelve borradores: nadie recibe la versión hasta que se pulsa «Publish release».
# La firma sale de los secretos del repositorio (Settings → Secrets and variables → Actions):
#   FIRMA_ALMACEN_B64 (el .jks en base64), FIRMA_CLAVE_ALMACEN, FIRMA_ALIAS y FIRMA_CLAVE_ALIAS.
# Sin ellos el workflow se detiene: una .apk con otra firma no se podría instalar encima de la anterior.
name: Compilar Chat Princess

on:
  workflow_dispatch:
    inputs:
      destino:
        description: "Qué hacer con la .apk"
        type: choice
        options:
          - solo-descarga
          - borrador
        default: solo-descarga

permissions:
  contents: write

concurrency:
  group: compilar-chat-movil
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Comprobar versión
        id: version
        run: |
          set -euo pipefail
          nombre=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          codigo=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "versionName=$nombre versionCode=$codigo"
          [[ "$nombre" =~ ^[0-9]+\.[0-9]+\.[0-9]*[02468]$ ]] || { echo "La versión debe acabar en número par (como el Organizador)"; exit 1; }
          grep -q "^# v$nombre" CHANGELOG.md || { echo "Falta la entrada «# v$nombre» en CHANGELOG.md"; exit 1; }
          if [ "${{ inputs.destino }}" = "borrador" ]; then
            if gh release view "v$nombre" >/dev/null 2>&1; then echo "Ya existe una Release v$nombre"; exit 1; fi
          fi
          awk -v v="# v$nombre" '$0==v{f=1;next} /^# v/{if(f)exit} f' CHANGELOG.md > notas_release.md
          echo "version=$nombre" >> "$GITHUB_OUTPUT"
          echo "apk=ChatPrincess_$nombre.apk" >> "$GITHUB_OUTPUT"

      - name: Preparar la firma
        env:
          FIRMA_ALMACEN_B64: ${{ secrets.FIRMA_ALMACEN_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${FIRMA_ALMACEN_B64}" ]; then echo "Faltan los secretos de firma (ver README)"; exit 1; fi
          echo "${FIRMA_ALMACEN_B64}" | base64 -d > "$RUNNER_TEMP/firma.jks"
          echo "FIRMA_ALMACEN=$RUNNER_TEMP/firma.jks" >> "$GITHUB_ENV"

      - name: Pruebas y compilación
        env:
          FIRMA_CLAVE_ALMACEN: ${{ secrets.FIRMA_CLAVE_ALMACEN }}
          FIRMA_ALIAS: ${{ secrets.FIRMA_ALIAS }}
          FIRMA_CLAVE_ALIAS: ${{ secrets.FIRMA_CLAVE_ALIAS }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease
          mkdir -p salida
          cp app/build/outputs/apk/release/app-release.apk "salida/${{ steps.version.outputs.apk }}"
          # Hay varias versiones de build-tools en el servidor de GitHub: se usa la más reciente
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "salida/${{ steps.version.outputs.apk }}" | head -3
          (cd salida && sha256sum "${{ steps.version.outputs.apk }}" > "${{ steps.version.outputs.apk }}.sha256" && cat *.sha256)
          rm -f "$RUNNER_TEMP/firma.jks"

      - name: Guardar la .apk como descarga
        uses: actions/upload-artifact@v4
        with:
          name: ChatPrincess_${{ steps.version.outputs.version }}
          path: salida/
          retention-days: 30

      - name: Crear la Release en BORRADOR (no llega a los móviles)
        if: inputs.destino == 'borrador'
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "salida/${{ steps.version.outputs.apk }}" "salida/${{ steps.version.outputs.apk }}.sha256" \
            --draft --target "${{ github.sha }}" \
            --title "Chat Dpto. Compras Princess v${{ steps.version.outputs.version }}" --notes-file notas_release.md
          echo "Borrador creado. Revísalo en Releases y pulsa «Publish release» cuando quieras que se actualicen los móviles."
